<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Product — Inventory Replenishment Planner</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#f5f7fb; color:#182230; font:15px/1.5 Arial,sans-serif; }
    header { background:linear-gradient(120deg,#172554,#2563eb); color:white; padding:28px 20px; }
    main { max-width:850px; margin:28px auto; padding:0 18px; }
    .panel { background:white; border:1px solid #e4e7ec; border-radius:14px; padding:24px; box-shadow:0 4px 16px #1018280a; }
    h1 { margin:0; font-size:28px; } h2 { margin:0 0 18px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    label { display:block; margin-bottom:6px; font-size:13px; font-weight:600; }
    input { width:100%; padding:11px; border:1px solid #cfd4dc; border-radius:8px; font:inherit; }
    .actions { display:flex; gap:10px; margin-top:20px; }
    button,a { border:0; border-radius:8px; padding:11px 15px; font:inherit; font-weight:600; text-decoration:none; cursor:pointer; }
    button { background:#2457d6; color:white; } a { background:#eef2ff; color:#2446a8; }
    @media(max-width:600px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<header><h1>Inventory Replenishment Planner</h1></header>
<main>
  <section class="panel">
    <h2>Edit Product</h2>
    <form method="post">
      <div class="grid">
        <div><label for="name">Product Name</label><input id="name" name="name" required maxlength="100" value="{{ product['name'] }}"></div>
        <div><label for="quantity">Current Quantity</label><input id="quantity" name="quantity" type="number" min="0" step="1" required value="{{ product['quantity'] }}"></div>
        <div><label for="reorder_level">Reorder Level</label><input id="reorder_level" name="reorder_level" type="number" min="0" step="1" required value="{{ product['reorder_level'] }}"></div>
        <div><label for="daily_demand">Daily Demand</label><input id="daily_demand" name="daily_demand" type="number" min="0" step="1" required value="{{ product['daily_demand'] }}"></div>
        <div><label for="lead_time">Lead Time (days)</label><input id="lead_time" name="lead_time" type="number" min="0" step="1" required value="{{ product['lead_time'] }}"></div>
      </div>
      <div class="actions"><button type="submit">Save Changes</button><a href="{{ url_for('home') }}">Cancel</a></div>
    </form>
  </section>
</main>
</body>
</html>
